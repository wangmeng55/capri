<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Capri 手机端延迟测量</title>
<style>
  :root { color-scheme: light dark; --bg:#0e0f12; --fg:#e8e9ee; --mut:#9aa0ad; --card:#171922; --acc:#5b8cff; --line:#252838; }
  * { box-sizing: border-box; }
  body { margin:0; padding:14px; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:18px; margin:0 0 10px; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; }
  button { margin-top:12px; width:100%; padding:12px; border:0; border-radius:10px; background:var(--acc); color:#fff; font:inherit; font-weight:600; }
  button:disabled { opacity:.5; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-top:12px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:right; padding:6px 4px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  .big { font-size:23px; font-weight:700; }
  .mut { color:var(--mut); font-size:12px; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:11px; color:var(--mut); margin:0; }
</style>
</head>
<body>
<h1>Capri 手机端延迟测量</h1>
<p class="mut">在手机浏览器打开本页，输入 hub 地址后点开始。测量期间请不要切换 App。</p>

<label for="hub">Hub 地址</label>
<input id="hub" value="https://console.xidianwm.duckdns.org" autocapitalize="off" autocorrect="off" spellcheck="false" />

<label for="n">采样次数</label>
<input id="n" type="number" value="20" min="5" max="100" inputmode="numeric" />

<button id="run">开始测量</button>

<div id="out"></div>

<script>
"use strict";

function pct(sorted, p) {
  if (!sorted.length) return 0;
  const i = Math.min(sorted.length - 1, Math.max(0, Math.ceil(p / 100 * sorted.length) - 1));
  return sorted[i];
}
function stats(arr) {
  const s = [...arr].sort((a, b) => a - b);
  return { n: s.length, p50: pct(s, 50), p95: pct(s, 95), min: s[0], max: s[s.length - 1] };
}
const fmt = (v) => (v == null ? "-" : v.toFixed(1));

async function measureOnce(base) {
  const url = base.replace(/\/$/, "") + "/?lat=" + Date.now() + "-" + Math.random().toString(36).slice(2);
  const t0 = performance.now();
  // no-cors：跨域时拿不到状态码，但墙钟时间仍然准确，这正是我们要的 RTT。
  await fetch(url, { mode: "no-cors", cache: "no-store", credentials: "omit" });
  const t1 = performance.now();
  return t1 - t0;
}

async function run() {
  const base = document.getElementById("hub").value.trim();
  const n = Math.max(5, Math.min(100, parseInt(document.getElementById("n").value, 10) || 20));
  const btn = document.getElementById("run");
  const out = document.getElementById("out");
  btn.disabled = true;
  out.innerHTML = '<div class="card">测量中…</div>';

  const warm = [];
  const errors = [];
  // 第 1 次单独记录：可能包含 DNS + TCP + TLS（冷连接）。
  let cold = null;
  try { cold = await measureOnce(base); } catch (e) { errors.push(String(e)); }

  for (let i = 0; i < n; i++) {
    try { warm.push(await measureOnce(base)); } catch (e) { errors.push(String(e)); }
    await new Promise((r) => setTimeout(r, 120));
  }

  const w = stats(warm);
  const json = {
    ua: navigator.userAgent,
    connection: navigator.connection ? {
      effectiveType: navigator.connection.effectiveType,
      downlink: navigator.connection.downlink,
      rtt: navigator.connection.rtt
    } : null,
    hub: base,
    coldMs: cold,
    warm: w,
    errors: errors.length
  };

  out.innerHTML = `
    <div class="card">
      <div class="mut">冷启动（首次，含 DNS/TCP/TLS）</div>
      <div class="big">${fmt(cold)} ms</div>
      <div class="mut" style="margin-top:10px">热路径 RTT（连接复用后，最影响交互手感）</div>
      <table>
        <tr><th>p50</th><th>p95</th><th>min</th><th>max</th><th>n</th></tr>
        <tr><td>${fmt(w.p50)} ms</td><td>${fmt(w.p95)} ms</td><td>${fmt(w.min)}</td><td>${fmt(w.max)}</td><td>${w.n}</td></tr>
      </table>
      ${errors.length ? `<div class="mut" style="margin-top:8px">失败 ${errors.length} 次</div>` : ""}
    </div>
    <div class="card">
      <div class="mut">把下面这段发回给开发者</div>
      <pre>${JSON.stringify(json, null, 2)}</pre>
    </div>`;
  btn.disabled = false;
  window.__capriLatencyResult = json;
}

document.getElementById("run").addEventListener("click", run);
</script>
</body>
</html>
