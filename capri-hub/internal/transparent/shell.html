<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Capri</title>
  <style>
    :root { color-scheme: light dark; --bg:#0e0f12; --fg:#e8e9ee; --mut:#9aa0ad; --card:#171922; --acc:#5b8cff; --line:#252838; }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); height:100dvh; }
    header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line); }
    header .brand { font-weight:600; letter-spacing:.02em; }
    #toggleHosts { width:100%; min-height:36px; padding:6px 10px; font-size:18px; line-height:1.2; }
    main { display:grid; grid-template-columns: 280px minmax(0, 1fr); height:calc(100dvh - 49px); }
    #app.sidebar-collapsed main { grid-template-columns: 48px minmax(0, 1fr); }
    aside { display:flex; flex-direction:column; gap:8px; border-right:1px solid var(--line); overflow:auto; padding:10px; }
    #app.sidebar-collapsed aside#hosts { padding:6px; }
    #app.sidebar-collapsed #hostList { display:none; }
    section.view { position:relative; min-width:0; background:#fff; }
    iframe#frame { position:absolute; inset:0; width:100%; height:100%; border:0; background:#fff; }
    .empty { color:var(--mut); padding:18px; }
    button { background:var(--acc); color:#fff; border:0; border-radius:8px; padding:8px 12px; font:inherit; cursor:pointer; }
    button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
    input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; }
    .login { max-width:360px; margin:12vh auto; padding:24px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
    .login h1 { margin:0 0 14px; font-size:20px; }
    .login p.err { color:#ff6b6b; min-height:1.2em; margin:8px 0 0; font-size:13px; }
    .host { display:flex; flex-direction:column; gap:3px; width:100%; text-align:left; padding:10px 12px; margin-bottom:8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
    .host[aria-selected="true"] { border-color:var(--acc); }
    .host .name { font-weight:600; }
    .host .meta { color:var(--mut); font-size:12px; }
    .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; background:#666; }
    .dot.on { background:#39d98a; } .dot.ready { background:#5b8cff; } .dot.off { background:#777; }
    .note { color:var(--mut); font-size:13px; padding:12px; }
    .diag-button { width:100%; min-height:38px; }
    #app.sidebar-collapsed .diag-button { font-size:0; }
    #app.sidebar-collapsed .diag-button::after { content:"⌁"; font-size:20px; }
    .diag-backdrop { position:fixed; inset:auto 12px 12px auto; z-index:10; display:flex; align-items:flex-end; justify-content:flex-end; padding:0; background:transparent; pointer-events:none; }
    .diag-backdrop[hidden] { display:none; }
    .diag-panel { pointer-events:auto; width:min(760px,calc(100vw - 24px)); max-height:72dvh; overflow:auto; border:1px solid var(--line); border-radius:14px; padding:16px; background:var(--bg); color:var(--fg); box-shadow:0 12px 40px #0008; }
    .diag-restore { position:fixed; right:12px; bottom:12px; z-index:11; box-shadow:0 4px 16px #0008; }
    .diag-panel h2 { margin:0 0 10px; font-size:19px; }
    .diag-panel h3 { margin:18px 0 6px; font-size:15px; }
    .diag-panel p { margin:8px 0; }
    .diag-muted { color:var(--mut); font-size:13px; }
    .diag-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .diag-card { border:1px solid var(--line); border-radius:9px; padding:10px; margin:8px 0; background:var(--card); }
    .diag-scroll { overflow:auto; }
    .diag-table { width:100%; border-collapse:collapse; font-size:12px; }
    .diag-table th,.diag-table td { text-align:left; padding:6px; border-bottom:1px solid var(--line); white-space:nowrap; }
    @media (max-width:520px) { .diag-backdrop { inset:auto 8px 8px; } .diag-panel { width:100%; max-height:72dvh; border-radius:12px; border:1px solid var(--line); padding:14px; } .diag-restore { right:8px; bottom:8px; } }
  </style>
</head>
<body>
  <div id="login" class="login" hidden>
    <h1>Capri</h1>
    <form id="loginForm" autocomplete="on">
      <input id="token" type="password" placeholder="Access token" autocomplete="current-password" required />
      <div style="height:10px"></div>
      <button type="submit" style="width:100%">Sign in</button>
      <p class="err" id="loginErr"></p>
    </form>
  </div>

  <div id="app" hidden>
    <header>
      <span class="brand">Capri</span>
      <button class="ghost" id="logout">Sign out</button>
    </header>
    <main>
      <aside id="hosts">
        <button class="ghost" id="toggleHosts" type="button" aria-controls="hostList" aria-expanded="true" aria-label="Hide host list" title="Hide host list">☰</button>
        <button class="diag-button" id="diagnose" type="button" title="诊断当前主机连接">连接诊断</button>
        <div id="hostList"><div class="empty">Loading hosts…</div></div>
      </aside>
      <section class="view" id="view">
        <div class="empty" id="viewHint">Select a host to begin.</div>
        <iframe id="frame" name="frame" title="agent view" hidden></iframe>
      </section>
    </main>
    <div class="diag-backdrop" id="diagBackdrop" hidden>
      <section class="diag-panel" role="dialog" aria-modal="false" aria-labelledby="diagTitle">
        <h2 id="diagTitle">连接诊断</h2>
        <div id="diagContent" aria-live="polite"><p>尚未开始。</p></div>
        <div class="diag-actions">
          <button class="ghost" id="diagMinimize" type="button">收起</button>
          <button class="ghost" id="diagStop" type="button" hidden>停止捕获</button>
          <button class="ghost" id="diagExport" type="button" hidden>导出 JSON</button>
          <button class="ghost" id="diagClose" type="button">关闭</button>
        </div>
      </section>
    </div>
    <button class="diag-restore" id="diagRestore" type="button" hidden>打开连接诊断</button>
  </div>

  <script>
    "use strict";
    var state = { csrf: "", hosts: [], accessToken: sessionStorage.getItem("capri-token") || "", selectedHost: null, diagRunID: "", diagReport: null, diagPoll: 0, diagCountdown: 0 };

    function $(id) { return document.getElementById(id); }
    function show(el, on) { el.hidden = !on; }

    function setHostsCollapsed(collapsed, persist) {
      $("app").classList.toggle("sidebar-collapsed", collapsed);
      var toggle = $("toggleHosts");
      toggle.setAttribute("aria-expanded", String(!collapsed));
      toggle.setAttribute("aria-label", collapsed ? "Show host list" : "Hide host list");
      toggle.title = collapsed ? "Show host list" : "Hide host list";
      if (persist) {
        try { localStorage.setItem("capri-sidebar-collapsed", collapsed ? "true" : "false"); } catch (e) {}
      }
    }

    $("toggleHosts").addEventListener("click", function () {
      setHostsCollapsed(!$("app").classList.contains("sidebar-collapsed"), true);
    });

    try { setHostsCollapsed(localStorage.getItem("capri-sidebar-collapsed") === "true", false); } catch (e) {}

    async function api(path, opts) {
      opts = opts || {};
      opts.headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      if (state.accessToken && path !== "/api/auth/login") opts.headers.Authorization = "Bearer " + state.accessToken;
      if (state.csrf && opts.method && opts.method !== "GET") opts.headers["X-Capri-CSRF"] = state.csrf;
      var res = await fetch(path, opts);
      var data = null;
      try { data = await res.json(); } catch (e) {}
      return { ok: res.ok, status: res.status, data: data };
    }

    async function boot() {
      if (!state.accessToken) { show($("login"), true); return; }
      var s = await api("/api/auth/session");
      if (s.ok && s.data) { state.csrf = s.data.csrf || ""; enterApp(); }
      else { state.accessToken = ""; sessionStorage.removeItem("capri-token"); show($("login"), true); }
    }

    function enterApp() {
      show($("login"), false);
      show($("app"), true);
      loadHosts();
    }

    $("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      $("loginErr").textContent = "";
      var token = $("token").value;
      var r = await api("/api/auth/login", { method: "POST", body: JSON.stringify({ token: token }) });
      if (!r.ok) { $("loginErr").textContent = (r.data && r.data.error) || ("login failed (" + r.status + ")"); return; }
      state.accessToken = token;
      sessionStorage.setItem("capri-token", token);
      $("token").value = "";
      state.csrf = (r.data && r.data.csrf) || "";
      state.hosts = [];
      enterApp();
    });

    $("logout").addEventListener("click", async function () {
      await api("/api/auth/logout", { method: "POST" });
      stopDiagnosticPolling(); state.diagRunID = ""; state.diagReport = null; state.selectedHost = null;
      state.accessToken = ""; sessionStorage.removeItem("capri-token");
      state.csrf = ""; state.hosts = [];
      $("frame").hidden = true; $("frame").src = "about:blank";
      show($("viewHint"), true);
      $("hostList").innerHTML = "";
      show($("app"), false); show($("login"), true);
      show($("diagBackdrop"), false); show($("diagRestore"), false);
    });

    async function loadHosts() {
      var r = await api("/api/hosts");
      if (!r.ok) { $("hostList").innerHTML = '<div class="empty">Failed to load hosts (' + r.status + ').</div>'; return; }
      state.hosts = (r.data && r.data.hosts) || [];
      renderHosts();
    }

    function renderHosts() {
      var box = $("hostList");
      if (!state.hosts.length) { box.innerHTML = '<div class="empty">No hosts paired yet.</div>'; return; }
      box.innerHTML = "";
      state.hosts.forEach(function (h) {
        var kind = h.kind || "opencode";
        var btn = document.createElement("button");
        btn.className = "host";
        btn.setAttribute("role", "option");
        var dotCls = h.ready ? "ready" : (h.online ? "on" : "off");
        var status = h.ready ? "ready" : (h.online ? "online" : "offline");
        btn.innerHTML = '<span class="name"><span class="dot ' + dotCls + '"></span>' + escapeHtml(h.hostName || h.hostId) + '</span>' +
          '<span class="meta">' + escapeHtml(kind) + ' · ' + status + '</span>';
        btn.addEventListener("click", function () { selectHost(h, btn); });
        box.appendChild(btn);
      });
    }

    function escapeHtml(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    }); }

    function diagMS(value) { return Number.isFinite(value) ? value.toFixed(1) + " ms" : "不可用"; }

    function renderDiagnostic(report, countdown) {
      state.diagReport = report;
      var browser = report.browserToHub || [];
      var tunnel = report.hubToHostRtt || report.hubToHostWss || [];
      var good = function (items) { return items.filter(function (x) { return x.result === "ok"; }); };
      var summarize = function (items) {
        var ok = good(items);
        if (!ok.length) return "无成功样本（" + items.map(function (x) { return x.result; }).join(", ") + "）";
        var vals = ok.map(function (x) { return x.durationMs; }).sort(function (a,b) { return a-b; });
        return "中位数 " + diagMS(vals[Math.floor(vals.length / 2)]) + "；成功 " + ok.length + "/" + items.length;
      };
      var health = report.hostHealth || {};
      var rows = (report.requests || []).map(function (r) {
        return "<tr><td>" + escapeHtml(r.method) + "</td><td>" + escapeHtml(r.path) + "</td><td>" + escapeHtml(r.state) + (r.failureStage ? " · " + escapeHtml(r.failureStage) : "") + "</td><td>" + (r.hubStatus || "—") + " / " + (r.hostStatus || "—") + "</td>" +
          "<td>" + diagMS(r.hubToTunnelMs) + "</td><td>" + diagMS(r.hubHostReceiptConfirmMs) + "</td><td>" + diagMS(r.hostLocalStartMs) + "</td><td>" + diagMS(r.hostFirstResponseMs) + "</td><td>" + diagMS(r.hostFirstBodyByteMs) + "</td><td>" + diagMS(r.hostBodyReadMs) + (r.hostBodyReadBytes ? " · " + r.hostBodyReadBytes + " B" : "") + "</td>" +
          "<td>" + diagMS(r.hostFlowWaitMs) + "</td><td>" + diagMS(r.hostTunnelWriteMs) + "</td><td>" + diagMS(r.hostCompleteMs) + "</td><td>" + diagMS(r.hubHostCompleteReceiptMs) + "</td><td>" + diagMS(r.hubAfterHostCompleteMs) + "</td><td>" + diagMS(r.hubFirstDataMs) + "</td><td>" + diagMS(r.hubMaxDataGapMs) + "</td><td>" + diagMS(r.hubAfterLastDataMs) + "</td><td>" + (r.hubDataFrames || 0) + "</td><td>" + diagMS(r.hubFrameWaitMs) + "</td><td>" + diagMS(r.hubClientWriteMs) + "</td><td>" + diagMS(r.hubTotalMs) + "</td><td>" + (r.responseBytes || 0) + "</td></tr>";
      }).join("");
      var captureText = report.state === "capturing" ? "请点“收起”后切换一次会话。剩余约 " + countdown + " 秒；收起后仍会继续捕获请求元数据，不记录正文。" :
        (report.state === "ready" ? "基线探测完成，准备开始捕获。" : "捕获已结束。已记录 " + (report.requests || []).length + " 个请求" + (report.omittedRequests ? "，另有 " + report.omittedRequests + " 个因上限未记录" : "") + "。");
      $("diagContent").innerHTML =
        '<p><strong>' + escapeHtml(captureText) + '</strong></p>' +
        '<div class="diag-card">主机：' + escapeHtml(report.hostId) + '<br>数据通道：' + escapeHtml(report.transport) + ' · ' + (report.tunnelConnected ? "已连接" : "未连接") + (report.tunnelConnected ? " · 已连接 " + diagMS(report.tunnelAgeMs) : "") + '<br>Hub 观察到重连：' + (report.reconnects || 0) + ' 次</div>' +
        '<h3>基线探测</h3><div class="diag-card">手机浏览器 → Hub：' + escapeHtml(summarize(browser)) + '<br>Hub → Host 隧道往返：' + escapeHtml(summarize(tunnel)) + '<br>Host → OpenCode /health：' + escapeHtml(health.result || "不可用") + (health.status ? " · HTTP " + health.status : "") + (health.durationMs ? " · 总计 " + diagMS(health.durationMs) : "") + (health.hubWaitMs ? " · Hub 等首响 " + diagMS(health.hubWaitMs) : "") + (health.hostLocalMs ? " · Host 本机处理 " + diagMS(health.hostLocalMs) : "") + (health.responseBytes ? " · " + health.responseBytes + " B" : "") + '</div>' +
        '<h3>捕获到的真实请求</h3>' + (rows ? '<div class="diag-scroll"><table class="diag-table"><thead><tr><th>方法</th><th>路径（不含查询）</th><th>状态/失败阶段</th><th>HTTP Hub/Host</th><th>Hub 发隧道</th><th>Hub 收到 Host 回执</th><th>Host 调 OpenCode</th><th>OpenCode 响应头</th><th>OpenCode 首正文</th><th>Host 读正文阻塞累计</th><th>Host 流控等待</th><th>Host 隧道写阻塞</th><th>Host 转发完成</th><th>Hub 收到 Host 完成</th><th>Host 完成后 Hub 等待结束帧</th><th>Hub 收到首块正文</th><th>Hub 最大块间隔</th><th>Hub 最后一块后等结束帧</th><th>正文帧数</th><th>Hub 等隧道帧</th><th>Hub 写浏览器</th><th>Hub 总计</th><th>返回字节</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '<p class="diag-muted">切换会话后，请求会显示在这里。</p>') +
        '<p class="diag-muted">' + escapeHtml(report.packetLossNote || "") + '</p>' +
        '<p class="diag-muted">Host 读正文阻塞累计只统计等待 OpenCode Read 返回数据的时间；Host 隧道写阻塞统计本机写帧所花时间，不代表对端已确认收到。新增的 Hub 帧时点都使用 Hub 自己的计时：Host 完成通知到结束帧的间隔可定位响应结束阶段；首块、最大块间隔和末块到结束帧可定位正文传输停顿。Hub 等帧包含等待 Host 数据、生成和传输的时间；Hub 写浏览器只统计 Hub 响应写入/Flush 调用时间。Hub 收到 Host 回执是往返确认，不是单程延迟。各进程使用自己的单调计时，不跨机器相减。hostReceivedMs 是 Host 计时起点，接近 0 属正常。浏览器到 Hub 是 HTTPS 往返探测，不是 iframe 单条请求的 Resource Timing。</p>';
      show($("diagStop"), report.state === "capturing");
      show($("diagExport"), report.state !== "capturing");
    }

    function stopDiagnosticPolling() {
      if (state.diagPoll) { clearInterval(state.diagPoll); state.diagPoll = 0; }
      if (state.diagCountdown) { clearInterval(state.diagCountdown); state.diagCountdown = 0; }
    }

    async function pollDiagnostic() {
      if (!state.diagRunID) return;
      var r = await api("/api/diagnostics/" + encodeURIComponent(state.diagRunID));
      if (!r.ok || !r.data) return;
      var left = Math.max(0, Math.ceil(((state.diagUntil || Date.now()) - Date.now()) / 1000));
      renderDiagnostic(r.data, left);
      if (r.data.state !== "capturing") { stopDiagnosticPolling(); $("diagnose").disabled = false; }
    }

    async function startDiagnostics() {
      if (!state.selectedHost) {
        $("diagContent").innerHTML = "<p>请先选择一台主机，再开始诊断。</p>";
        show($("diagBackdrop"), true); show($("diagRestore"), false);
        return;
      }
      stopDiagnosticPolling();
      $("diagnose").disabled = true;
      state.diagRunID = ""; state.diagReport = null;
      $("diagContent").innerHTML = "<p>正在检查 Host 隧道并请求本机健康接口…</p>";
      show($("diagBackdrop"), true); show($("diagRestore"), false); show($("diagStop"), false); show($("diagExport"), false);
      var started = await api("/api/diagnostics", { method: "POST", body: JSON.stringify({ hostId: state.selectedHost.hostId }) });
      if (!started.ok || !started.data || !started.data.runId) {
        $("diagContent").textContent = (started.data && started.data.error) || ("无法启动诊断（" + started.status + "）");
        $("diagnose").disabled = false;
        return;
      }
      state.diagRunID = started.data.runId;
      $("diagContent").innerHTML = "<p>正在测量手机浏览器到 Hub 的 HTTPS 往返…</p>";
      var samples = [];
      for (var i = 0; i < 5; i++) {
        $("diagContent").innerHTML = "<p>正在测量手机浏览器到 Hub 的 HTTPS 往返…（" + (i + 1) + "/5）</p>";
        var begin = performance.now();
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 5000);
        var ping;
        try { ping = await api("/api/diagnostics/" + encodeURIComponent(state.diagRunID) + "/ping", { signal: controller.signal, cache: "no-store" }); }
        catch (e) { ping = { ok: false, status: 0 }; }
        clearTimeout(timer);
        samples.push({ durationMs: performance.now() - begin, result: ping.ok ? "ok" : (ping.status === 0 ? "timeout" : "failed") });
      }
      var saved = await api("/api/diagnostics/" + encodeURIComponent(state.diagRunID) + "/browser-samples", { method: "POST", body: JSON.stringify({ samples: samples }) });
      if (!saved.ok) { $("diagContent").textContent = "浏览器探测结果未能保存（" + saved.status + "）。"; $("diagnose").disabled = false; return; }
      var capture = await api("/api/diagnostics/" + encodeURIComponent(state.diagRunID) + "/capture", { method: "POST", body: "{}" });
      if (!capture.ok || !capture.data) { $("diagContent").textContent = "无法开始请求捕获（" + capture.status + "）。"; $("diagnose").disabled = false; return; }
      state.diagReport = capture.data;
      state.diagUntil = Date.now() + 60000;
      renderDiagnostic(capture.data, 60);
      state.diagCountdown = setInterval(function () {
        var left = Math.max(0, Math.ceil((state.diagUntil - Date.now()) / 1000));
        if (state.diagReport && state.diagReport.state === "capturing") {
          $("diagContent").firstElementChild.innerHTML = "<strong>请点“收起”后切换一次会话。剩余约 " + left + " 秒；收起后仍会继续捕获请求元数据，不记录正文。</strong>";
        }
      }, 1000);
      state.diagPoll = setInterval(pollDiagnostic, 1500);
    }

    $("diagnose").addEventListener("click", function () {
      startDiagnostics().catch(function () {
        $("diagContent").textContent = "诊断请求中断，请检查当前网络或主机连接后重试。";
        $("diagnose").disabled = false;
      });
    });
    async function closeDiagnostic() {
      var shouldStop = state.diagRunID && state.diagReport && state.diagReport.state === "capturing";
      show($("diagBackdrop"), false); show($("diagRestore"), false);
      if (shouldStop) {
        stopDiagnosticPolling();
        $("diagnose").disabled = false;
        try {
          var stopped = await api("/api/diagnostics/" + encodeURIComponent(state.diagRunID) + "/stop", { method: "POST", body: "{}" });
          if (stopped.ok && stopped.data) state.diagReport = stopped.data;
        } catch (e) {}
      }
    }
    $("diagClose").addEventListener("click", closeDiagnostic);
    $("diagMinimize").addEventListener("click", function () {
      show($("diagBackdrop"), false);
      show($("diagRestore"), true);
    });
    $("diagRestore").addEventListener("click", function () {
      show($("diagRestore"), false);
      show($("diagBackdrop"), true);
    });
    $("diagBackdrop").addEventListener("click", function (e) { if (e.target === $("diagBackdrop")) closeDiagnostic(); });
    $("diagStop").addEventListener("click", async function () {
      if (!state.diagRunID) return;
      var r = await api("/api/diagnostics/" + encodeURIComponent(state.diagRunID) + "/stop", { method: "POST", body: "{}" });
      if (r.ok && r.data) renderDiagnostic(r.data, 0);
      stopDiagnosticPolling();
      $("diagnose").disabled = false;
    });
    $("diagExport").addEventListener("click", function () {
      if (!state.diagReport) return;
      var blob = new Blob([JSON.stringify(state.diagReport, null, 2)], { type: "application/json" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob); link.download = "capri-diagnostic-" + state.diagReport.runId + ".json";
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 60000);
    });

    async function selectHost(h, btn) {
      state.selectedHost = h;
      Array.prototype.forEach.call(document.querySelectorAll(".host"), function (b) { b.setAttribute("aria-selected", "false"); });
      if (btn) btn.setAttribute("aria-selected", "true");
      // Redeem a one-time view ticket into a host-only cookie, then
      // load the official frontend in the iframe at its own origin.
      var t = await api("/api/hosts/" + encodeURIComponent(h.hostId) + "/view-ticket", { method: "POST" });
      if (!t.ok || !t.data || !t.data.ticket || !t.data.origin) {
        show($("viewHint"), true); $("frame").hidden = true;
        $("viewHint").textContent = "Could not get a view ticket (" + t.status + ").";
        return;
      }
      var form = document.createElement("form");
      form.method = "POST";
      form.action = t.data.origin + "/__capri/session";
      form.target = "frame";
      form.style.display = "none";
      var input = document.createElement("input");
      input.type = "hidden"; input.name = "ticket"; input.value = t.data.ticket;
      form.appendChild(input);
      document.body.appendChild(form);
      show($("viewHint"), false);
      $("frame").hidden = false;
      $("frame").src = "about:blank";
      form.submit();
      setTimeout(function () { form.remove(); }, 0);
    }

    boot();
  </script>
</body>
</html>
