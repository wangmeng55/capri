name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: windows, goarch: arm64, ext: .exe }
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: capri-host/go.mod
          cache: true
          cache-dependency-path: |
            capri-host/go.sum
            capri-transport/go.sum

      - name: Build OpenCode host
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p capri-host/dist
          go build -C capri-host -trimpath -ldflags "-s -w" -o "dist/opencode-host-${GOOS}-${GOARCH}${{ matrix.ext }}" ./cmd/opencode-host

      - uses: actions/upload-artifact@v6
        with:
          name: opencode-host-${{ matrix.goos }}-${{ matrix.goarch }}
          path: capri-host/dist/opencode-host-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: opencode-host-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          name: Capri OpenCode Host ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: dist/*
